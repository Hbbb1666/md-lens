  /* ==================== 生成 Excel (.xlsx) ==================== */
  function buildXlsx(blocks){
    return LIB.load("xlsx.full.min.js").then(function(){
      var wb = XLSX.utils.book_new();
      var tables = blocks.filter(function(b){ return b.type === "table" && b.rows.length; });
      // 表格各占一个工作表（原有行为）；但文档里同时有标题/正文时，
      // 只导出表格会把非表格内容整段丢掉 —— 用户拿到的是一个没有上下文的表。
      // 所以额外补一个「内容」工作表，把完整大纲按 序号/类型/内容 列出来。
      tables.forEach(function(t, i){
        var ws = XLSX.utils.aoa_to_sheet(t.rows);
        XLSX.utils.book_append_sheet(wb, ws, "表" + (i + 1));
      });
      var others = blocks.filter(function(b){ return b.text; });
      if (!tables.length || others.length){
        var rows = [["序号", "类型", "内容"]];
        others.forEach(function(b, i){
          var label = b.type === "h" ? ("标题" + b.level) : (b.type === "li" ? "要点" : "正文");
          rows.push([i + 1, label, b.text]);
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "内容");
      }
      if (!wb.SheetNames.length){
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["序号", "类型", "内容"]]), "内容");
      }
      var out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      return new Uint8Array(out);
    });
  }

  /* ==================== 生成 PPT (.pptx) ==================== */
  function paginateForPpt(blocks){
    var MAX_CHARS = 640, MAX_ITEMS = 8;
    var pages = [], cur = null;
    function newPage(title){ return { title: title || "", items: [], chars: 0 }; }
    blocks.forEach(function(b){
      if (b.type === "h" && b.level <= 2){
        if (cur && (cur.items.length || cur.title)) pages.push(cur);
        cur = newPage(b.text);
      } else if (b.type === "table"){
        if (!cur) cur = newPage("");
        b.rows.slice(0, 6).forEach(function(r){
          var line = r.join(" | ");
          if (cur.items.length >= MAX_ITEMS || cur.chars + line.length > MAX_CHARS){ pages.push(cur); cur = newPage(""); }
          cur.items.push(line); cur.chars += line.length;
        });
      } else if (b.text){
        if (!cur) cur = newPage("");
        if (cur.items.length >= MAX_ITEMS || cur.chars + b.text.length > MAX_CHARS){
          pages.push(cur); cur = newPage("");
        }
        cur.items.push(b.text); cur.chars += b.text.length;
      }
    });
    if (cur && (cur.items.length || cur.title)) pages.push(cur);
    if (!pages.length) pages.push(newPage("未命名"));
    return pages;
  }
  function buildPptx(blocks){
    return LIB.load("pptxgen.bundle.js").then(function(){
      var P = window.PptxGenJS;
      var pptx = new P();
      pptx.layout = "LAYOUT_16x9";
      var pages = paginateForPpt(blocks);
      pages.forEach(function(pg){
        var slide = pptx.addSlide();
        slide.background = { color: "FFFFFF" };
        if (pg.title){
          slide.addText(pg.title, {
            x: 0.5, y: 0.45, w: 9, h: 0.9,
            fontSize: pg.title.length > 24 ? 22 : 28, bold: true, color: "1F2328",
            valign: "middle"
          });
          slide.addShape(pptx.ShapeType.rect, { x: 0.55, y: 1.38, w: 1.2, h: 0.06, fill: { color: "0969DA" } });
        }
        if (pg.items.length){
          slide.addText(pg.items.map(function(t){
            return { text: t, options: { bullet: true, breakLine: true } };
          }), {
            x: 0.62, y: pg.title ? 1.62 : 0.7, w: 8.78, h: pg.title ? 3.85 : 4.6,
            fontSize: 16, color: "333333", valign: "top", lineSpacingMultiple: 1.2
          });
        }
      });
      return pptx.write({ outputType: "arraybuffer" }).then(function(buf){
        return new Uint8Array(buf);
      });
    });
  }

  /* ==================== 写文件 ==================== */
  function safeBase(){
    var n = state.current ? state.current.name : "document";
    n = n.replace(/\.[^.\/\\]+$/, "").replace(/[\\/:*?"<>|]+/g, "_").trim() || "document";
    return n;
  }
  function saveBytes(name, mime, u8){
    if (!NATIVE){
      var blob = new Blob([u8], { type: mime });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      toast("已下载 " + name);
      return;
    }
    MDNative.beginWrite(name, mime);
    var b64 = u8ToB64(u8), CH = 60000;
    for (var i = 0; i < b64.length; i += CH) MDNative.writeChunk(b64.slice(i, i + CH));
    MDNative.endWrite();
  }
  function exportAs(kind, srcText, srcName){
    var blocks;
    if (srcText != null){
      blocks = parseOutline(srcText);
    } else {
      blocks = currentBlocks();
      srcName = state.current ? state.current.name : "document";
    }
    if (!blocks.length){ toast("没有可导出的内容"); return; }
    var base = srcName ? String(srcName).replace(/\.[^.\/\\]+$/, "").replace(/[\\/:*?"<>|]+/g, "_") : safeBase();
    busy(true, "正在生成…");
    var job;
    if (kind === "docx") job = buildDocx(blocks).then(function(u8){ saveBytes(base + ".docx", "application/vnd.openxmlformats-officedocument.wordprocessingml.document", u8); });
    else if (kind === "xlsx") job = buildXlsx(blocks).then(function(u8){ saveBytes(base + ".xlsx", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", u8); });
    else if (kind === "pptx") job = buildPptx(blocks).then(function(u8){ saveBytes(base + ".pptx", "application/vnd.openxmlformats-officedocument.presentationml.presentation", u8); });
    else job = Promise.reject(new Error("未知格式"));
    job.catch(function(e){ toast("生成失败：" + (e.message || e), 4200); })
       .then(function(){ busy(false); });
  }

  /* ==================== 大纲解析（纯文本 / 中文层级） ==================== */
  function looksLikeMarkdown(text){
    // 只认强 markdown 标志（# 标题 / | 表格 / 代码块）。
    // 列表符号和 "1." 太宽松，会把「一、二、三」式大纲整段误判成 markdown。
    return /^#{1,6}\s/m.test(text) || /^\|.+\|$/m.test(text) || /```/.test(text);
  }
  function blocksFromPlainText(text){
    var lines = String(text || "").split(/\r?\n/), out = [], table = null;
    function flushTable(){
      if (table && table.rows.length){ out.push({ type: "table", rows: table.rows }); }
      table = null;
    }
    lines.forEach(function(raw){
      var t = raw.replace(/\s+$/, "");
      if (!t.trim()){ flushTable(); return; }
      // 表格行
      if (/^\s*\|.*\|\s*$/.test(t)){
        var cells = t.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(function(c){ return c.trim(); });
        var isSep = cells.every(function(c){ return /^:?-{2,}:?$/.test(c); });
        if (!table) table = { rows: [] };
        if (isSep){ return; }
        table.rows.push(cells);
        return;
      }
      flushTable();
      var m;
      if ((m = t.match(/^(#{1,6})\s+(.*)$/))){
        out.push({ type: "h", level: Math.min(3, m[1].length), text: m[2].trim() });
      } else if ((m = t.match(/^第?([一二三四五六七八九十百]+)[、.．章部分节]\s*(.*)$/))){
        out.push({ type: "h", level: 1, text: (m[2] || "").trim() || (m[1] + "、") });
      } else if ((m = t.match(/^[（(]([一二三四五六七八九十]+)[）)]\s*(.*)$/))){
        out.push({ type: "h", level: 2, text: (m[2] || "").trim() });
      } else if ((m = t.match(/^(\d+)[.、．]\s+(.*)$/))){
        out.push({ type: "li", text: m[2].trim() });
      } else if ((m = t.match(/^(\d+\.\d+)\s+(.*)$/))){
        out.push({ type: "h", level: 3, text: m[2].trim() });
      } else if ((m = t.match(/^\s*([-*•·+])\s+(.*)$/))){
        out.push({ type: "li", text: m[2].trim() });
      } else if ((m = t.match(/^>\s*(.*)$/))){
        out.push({ type: "quote", text: m[1].trim() });
      } else {
        out.push({ type: "p", text: t.trim() });
      }
    });
    flushTable();
    return out;
  }
  function parseOutline(text){
    return looksLikeMarkdown(text) ? blocksFromHtml(fakeInput(text, true)) : blocksFromPlainText(text);
  }

  /* ==================== 主题 / 字号 ==================== */
  function applyTheme(t){
    state.theme = t;
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem("mdlens.theme", t); } catch(e){}
    syncNativeTheme();
  }
  function syncNativeTheme(){
    var dark = state.theme === "dark" ||
      (state.theme === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    try { if (NATIVE && MDNative.syncTheme) MDNative.syncTheme(!!dark); } catch(e){}
  }
  function applyFs(delta){
    state.fs = Math.max(13, Math.min(26, state.fs + delta));
    document.documentElement.style.setProperty("--fs", state.fs + "px");
    try { localStorage.setItem("mdlens.fs", String(state.fs)); } catch(e){}
  }

    // 标题双击换主题

    $("title").onclick = function(){

      if (now - tap < 420){
        applyTheme(state.theme === "dark" ? "light" : (state.theme === "light" ? "auto" : "dark"));
        toast("主题：" + ({auto: "跟随系统", light: "亮色", dark: "暗色"})[state.theme]);
        tap = 0;
      } else tap = now;

    // 键盘
    document.addEventListener("keydown", function(e){
      if ((e.ctrlKey || e.metaKey) && e.key === "="){ e.preventDefault(); applyFs(1); }

      if ((e.ctrlKey || e.metaKey) && e.key === "f"){ e.preventDefault(); toggleSearch(); }

    });

    function pickLocal(){
      var inp = document.createElement("input");
      inp.type = "file";
      inp.accept = ".md,.markdown,.mdx,.txt,.docx,.pdf,.xlsx,.xls,.pptx,.json,.csv";
      inp.onchange = function(){
        var f = inp.files[0]; if (!f) return;
        var r = new FileReader();
        r.onload = function(){ routeFile(new Uint8Array(r.result), f.name); };
        r.readAsArrayBuffer(f);
      };
      inp.click();
    }
    document.addEventListener("dragover", function(e){ e.preventDefault(); });
    document.addEventListener("drop", function(e){
      e.preventDefault();
      var f = e.dataTransfer.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function(){ routeFile(new Uint8Array(r.result), f.name); };
      r.readAsArrayBuffer(f);
    });

    $("wHint").textContent = NATIVE
      ? "也可以在文件管理器里点文档，选「MD 解读」直接打开"
      : "浏览器版本：也可以直接把文件拖进这个页面";

    if (NATIVE && MDNative.ready) MDNative.ready();
  }

  /* ==================== 原生桥 ==================== */
  var _rx = { name: "", buf: [] };
  window.__nativeBegin = function(name){ _rx.name = name; _rx.buf = []; setProgress(25); };
  window.__nativeChunk = function(b64){ _rx.buf.push(b64); };
  window.__nativeEnd = function(){
    setProgress(85);
    try {
      var u8 = b64ToU8(_rx.buf.join(""));
      routeFile(u8, _rx.name);
    } catch(e){
      toast("打开失败：" + e.message, 4200);
    }
    _rx.buf = [];
    setProgress(null);
  };
  window.__nativeError = function(msg){ setProgress(null); busy(false); toast("打开失败：" + msg, 4200); };
  window.__nativeFiles = function(json){
    try {
      var files = JSON.parse(json);
      state.files = files;
      renderFileList(files);
      if (files.length) toast("找到 " + files.length + " 个文档");
      else toast("这个文件夹里没有找到文档");
      openDrawer("fileDrawer");
    } catch(e){ toast("列表解析失败"); }
  };
  window.__nativeSaved = function(msg){ setProgress(null); busy(false); toast(msg, 3400); };
  window.__nativeBusy = function(show, msg){
    busy(!!show, msg || "处理中…");
    if (!show) setProgress(null);
  };
  window.MDLens = {
    show: function(name, b64){ routeFile(b64ToU8(b64), name); },
    setFiles: function(json){ window.__nativeFiles(json); },
    toast: toast
  };

  function renderFileList(files){
    var box = $("fileList");
    if (!files.length){ box.innerHTML = '<div class="empty">这个文件夹里没有找到文档</div>'; return; }
    var frag = document.createDocumentFragment();
    files.forEach(function(f){
      var b = document.createElement("button");
      b.className = "fileitem";
      b.innerHTML = '<span class="nm">' + esc(f.name || f.path) + "</span>" +
        '<span class="meta">' + esc(f.dir || "") + (f.size ? " · " + fmtSize(f.size) : "") + "</span>";
      b.onclick = function(){
        closeDrawers();
        setProgress(25);
        if (NATIVE && MDNative.openFromList) MDNative.openFromList(f.uri, f.name);
      };
      frag.appendChild(b);
    });
    box.innerHTML = ""; box.appendChild(frag);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
